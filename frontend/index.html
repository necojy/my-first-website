<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>屈臣氏訂單查詢系統</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #0070f3; color: white; border: none; border-radius: 5px; }
        #result { margin-top: 30px; }
        
        /* 替表格加上一些簡單漂亮的樣式 */
        table { width: 90%; margin: 20px auto; border-collapse: collapse; text-align: left; }
        th { background-color: #f2f2f2; padding: 12px; border: 1px solid #ddd; }
        td { padding: 12px; border: 1px solid #ddd; vertical-align: top; }
        .amount { color: #d9534f; font-weight: bold; }
        .details { color: #555; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>🤖 屈臣氏雲端隱形機器人</h1>
    
    <button onclick="sendData()">呼叫機器人出動！</button>
    
    <div id="result" style="font-weight: bold;"></div>

    <script>
        async function sendData() {
            const backendUrl = "https://necojy-watsons-bot.hf.space/api/open_browser";
            
            document.getElementById('result').style.color = "blue";
            document.getElementById('result').innerText = "機器人正在雲端開啟網頁，請稍候約 15~20 秒...";
            
            try {
                const response = await fetch(backendUrl);
                const data = await response.json();
                
                let htmlContent = "";

                // 🌟 1. 如果成功抓到資料
                if (data['統計結果'] && data['統計結果'].length > 0) {
                    htmlContent += `<h2 style="color: green;">${data.message}</h2>`;
                    
                    // 區塊 A：統計摘要
                    htmlContent += `<h3>📊 統計摘要 (共 ${data['資料總筆數']} 筆)</h3>`;
                    htmlContent += "<ul style='text-align: left; display: inline-block;'>";
                    data['統計結果'].forEach(item => {
                        htmlContent += `<li style="font-size: 18px; margin-bottom: 8px;">${item}</li>`;
                    });
                    htmlContent += "</ul>";

                    // 區塊 B：詳細明細表格 (把新抓的資料印在這裡！)
                    if (data['詳細清單'] && data['詳細清單'].length > 0) {
                        htmlContent += `<hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">`;
                        htmlContent += `<h3>📜 完整訂單明細</h3>`;
                        htmlContent += `<table>`;
                        htmlContent += `<tr>
                                            <th>日期</th>
                                            <th>店名</th>
                                            <th>金額</th>
                                            <th>點數資訊</th>
                                            <th>購買商品明細</th>
                                        </tr>`;
                        
                        data['詳細清單'].forEach(order => {
                            // 🌟 將商品清單轉換成漂亮的 HTML 列表
                            let productsHtml = "<ul style='padding-left: 20px; margin: 0; text-align: left;'>";
                            
                            if (order['購買商品清單'] && order['購買商品清單'].length > 0) {
                                order['購買商品清單'].forEach(prod => {
                                    // 把名稱標成藍色，數量標成灰色
                                    productsHtml += `<li style="margin-bottom: 5px;">
                                                        <span style="color: #0056b3; font-weight: bold;">${prod['商品名稱']}</span> 
                                                        <span style="color: #666;">(${prod['數量']})</span>
                                                     </li>`;
                                });
                            } else {
                                productsHtml += `<li style="color: #999;">無商品明細 (可能是系統隱藏)</li>`;
                            }
                            productsHtml += "</ul>";

                            htmlContent += `<tr>
                                                <td style="white-space: nowrap;">${order['日期']}</td>
                                                <td style="white-space: nowrap;">${order['店名']}</td>
                                                <td class="amount">${order['金額']}</td>
                                                <td style="white-space: nowrap;">
                                                    <span style="color: green;">獲得: ${order['獲得點數']}</span><br>
                                                    <span style="color: red;">使用: ${order['使用點數']}</span>
                                                </td>
                                                <td class="details">${productsHtml}</td>
                                            </tr>`;
                        });
                        htmlContent += `</table>`;
                    }
                } 
                // 🌟 2. 如果沒抓到資料，但是有回傳報錯截圖
                else if (data.screenshot_base64) {
                    htmlContent += `<p style="color: red;">後端回報：${data.message} (錯誤: ${data.error || '無'})</p>`;
                    htmlContent += `<br><br><h3 style="color:red;">🤖 機器人當下看到的畫面：</h3>`;
                    htmlContent += `<img src="data:image/png;base64,${data.screenshot_base64}" style="max-width: 100%; border: 3px solid red; border-radius: 8px;"/>`;
                }
                // 🌟 3. 其他狀況
                else {
                    htmlContent += `<p style="color: orange;">後端回報狀況：${JSON.stringify(data)}</p>`;
                }
                
                document.getElementById('result').style.color = "black";
                document.getElementById('result').innerHTML = htmlContent;

            } catch (error) {
                document.getElementById('result').style.color = "red";
                document.getElementById('result').innerText = "連線失敗，請檢查網址或後端狀態";
            }
        }
    </script>
</body>
</html>
